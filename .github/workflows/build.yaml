name: check
on:
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - 
        uses: actions/checkout@v4
      - 
        uses: kevincobain2000/action-gobrew@v2
        with:
          version: latest
      -
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.0
          # Build the linter with the same Go the workflow installs: a prebuilt binary cannot read
          # the export data of a newer standard library ("export data version 5 is greater than
          # maximum supported version 4").
          install-mode: goinstall
      - 
        run: go test ./...
        shell: bash
      - 
        run: go build .
        shell: bash
